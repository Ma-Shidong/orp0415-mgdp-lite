name: Env

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 512
  max_episode_length: 3000

drone_model:
  name: Hummingbird
  controller: LeeAccelerationController

time_encoding: true
# Terrain / static obstacles (TOTAL count, not per-tile)
terrain_tile_size: 6.0
terrain_num_rows: 6
terrain_num_cols: 6
terrain_border_width: 2.0

# TOTAL number of static obstacles over the whole terrain
static_obs_num_total: 0
static_obs_max_total: 90
static_obs_width_range: [0.30, 0.60]
static_obs_platform_width: 14.0


success_curriculum:
  enable: true
  start_level: 0

  # Use plan_success early (flight_success can stay ~0 for long periods)
  metric: plan_success     # plan_success | flight_success

  # EMA smoothing
  ema_alpha: 0.05

  # Switch control (evaluations)
  patience: 3
  cooldown: 2

  levels:
  - name: L0_empty
    success_ge: 0.00
    static_obs_num_total: 0
    static_obs_platform_width: 14.0
    dynamic_obs_active: 0

  - name: L1_sparse_static
    success_ge: 0.08
    static_obs_num_total: 18
    static_obs_platform_width: 12.0
    dynamic_obs_active: 0

  - name: L2_medium
    success_ge: 0.16
    static_obs_num_total: 30
    static_obs_platform_width: 10.0
    dynamic_obs_active: 6

  - name: L3_hard
    success_ge: 0.24
    static_obs_num_total: 45
    static_obs_platform_width: 8.0
    dynamic_obs_active: 12

  - name: L4_dense
    success_ge: 0.32
    static_obs_num_total: 60
    static_obs_platform_width: 6.0
    dynamic_obs_active: 20

dynamic_obs_num: 30  # max moving obstacles that may appear (inactive ones will be parked)
trace_prob: 0.5 

lidar_range: 10.0
lidar_h_res: 36
lidar_v_res: 6
lidar_h_sample: 3
lidar_v_sample: 3
lidar_hfov: 360
lidar_vfov: [-7., 52.]
lidar_use_height_filter: false
lidar_radial_window: 3
lidar_radial_min_depth: 0.1
lidar_radial_max_depth: 10.0
lidar_radial_min_speed: 0.01
lidar_radial_max_speed: 10.0
lidar_radial_invalid_value: 0.0
lidar_radial_dt: 0.02
lidar_risk_decay_tau: 1.0
lidar_risk_clear_time: 3.0
lidar_risk_clear_margin: 1.0
lidar_risk_enable: true

# Optional: update lidar every N steps to reduce env-step cost
lidar_update_period: 1
bound_h: 1.

# Override env constraints
vel_max: 7.0
virtual_ceiling: 5.0


flow_gap: 25   
flow_slide_window: 5   

vis_lidar: false
vis_dismap: false

action_transform: null

reward_effort_weight: 0.1
reward_cfg:
  k_s: 0.0
lidar_effective_range: 10.0 #/m
lidar_v_edge_margin_deg: 6.0 #/degree

# -----------------------------
# Goal-oriented reward settings
# -----------------------------
reward_weights:
  k_v: 1.2
  k_a: 0.6
  k_j: 0.2
  k_h: 0.3
  k_g: 0.8
  k_s: 1.0
  k_d: 0.6
reach_goal_dis: 2.0
# "Touch" radius used in reward shaping (slow down / stop shaping).
# Default equals reach_goal_dis to avoid a reward gap. Increase if you explicitly
# want a larger slow-down zone near the goal.
touch_goal_dis: 2.0
terminate_on_success: true

# Training-time termination toggles (set false to penalize instead of terminate)
terminate_on_vel_limit: true
terminate_on_height_high: true
vel_limit_penalty: 1.0
height_high_penalty: 1.0
success_bonus: 40.0
time_penalty: 0.02

# Make safety reward penalty-only (no extra reward when far from obstacles)
safety_reward_max: 0.0

# Risk-memory options (optimized for vertical FOV edge disappearance)
lidar_risk_keep_far: false   # keep memory ONLY for top/bottom vertical edge bands (recommended)


# -----------------------------
# Risk-aware reward (TTC-based)
# -----------------------------
goal_reward_type: exp
goal_w_d: 3.0
goal_w_theta: 0.8
# Plan A: amplify goal progress
# progress = (last_dis - dis_now) * goal_progress_scale
# if goal_progress_scale_by_dt: progress /= dt
# then clamp to [-goal_progress_clamp, goal_progress_clamp]
goal_progress_scale: 1.0
goal_progress_scale_by_dt: false
goal_progress_clamp: 0.5
risk_gate_goal: true
risk_gate_g_min: 0.3
risk_relax_enable: true
risk_relax_eta_j: 0.5
risk_relax_eta_h: 0.5

risk_reward_enable: true
# risk_cfg:
#   T0: 3.0
#   v_min: 0.1
#   beta: 12.0
#   max_range: 8.0
#   alpha: 10.0
#   rho0: 0.2
#   w_r: 1.5

risk_cfg:
  T0: 1.0
  v_min: 0.05
  beta: 10.0
  max_range: 8.0
  alpha: 10.0
  rho0: 0.2
  w_r: 1.0
  # optional risk curriculum (linear schedule over frames)
  w_r_start: 0.3
  w_r_end: 1.0
  w_r_steps: 10000000

collision_penalty: 20.0
collision_include_height: true

# Debug prints are expensive; keep them off in training
debug_print_reward: false
# base env perf print (in isaac_env.py)
debug_print_perf: false
debug_print_perf_every: 50

static_obs_height_range:
- 4.0
- 6.0
dobs_height: 5.0
