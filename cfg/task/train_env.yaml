name: Env

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 128
  max_episode_length: 3000

drone_model:
  name: Hummingbird
  controller: LeeAccelerationController

time_encoding: true
static_obs_num_per_gird: 2 
dynamic_obs_num: 40
trace_prob: 0.5 

lidar_range: 10.
lidar_h_res: 36
lidar_v_res: 6
lidar_h_sample: 3
lidar_v_sample: 3
lidar_hfov: 360
lidar_vfov: [-7., 52.]
input_mode: p2m
mgdp_corridor_half_height: 1.0
mgdp_v2_radial_speed_scale: 6.0
mgdp_v2_use_effective_dt: true
mgdp_v2_corridor_sigma: 1.0
mgdp_v2_corridor_speed_adaptive: false
mgdp_v2_corridor_speed_gain: 0.12
mgdp_v2_corridor_forward_only: true
mgdp_v2_ttc_min_closing_speed: 0.15
mgdp_v2_ttc_horizon: 4.0
mgdp_v2_ttc_tau: 1.5
mgdp_v2_debug: false
mgdp_v2_debug_every: 100
lidar_use_height_filter: false
lidar_radial_window: 3
lidar_radial_min_depth: 0.1
lidar_radial_max_depth: 10.0
lidar_radial_min_speed: 0.01
lidar_radial_max_speed: 10.0
lidar_radial_invalid_value: 0.0
lidar_radial_dt: 0.02
lidar_risk_decay_tau: 1.0
lidar_risk_clear_time: 3.0
lidar_risk_clear_margin: 1.0
lidar_risk_enable: true
bound_h: 1.


flow_gap: 25   
flow_slide_window: 5   

vis_lidar: false
vis_dismap: false

action_transform: null
lidar_v_edge_margin_deg: 6.0 #/degree
