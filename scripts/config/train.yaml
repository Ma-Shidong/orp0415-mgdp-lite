# hydra.job.chdir: false
hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    - file://../cfg

# run
headless: false  # default to headless to avoid GLX errors on servers without a display

sim: ${task.sim}
env: ${task.env}

total_frames: 3_932_160_000
max_iters: 12000
eval_interval: 100
save_interval: 500

# Evaluation rollout length (steps). Higher = more accurate but slower and higher memory.
eval_max_steps: 3000
# Number of finished episodes per eval (fixed-size diagnostic sample).
eval_num_episodes: 128
# If you save videos, keep this smaller to avoid huge files.
eval_video_max_steps: 256
record_video: false
eval_seed_mode: random # random | fixed | sequence | none
eval_seed: 0

seed: 0

# PPO exploration / stability (can be overridden via CLI)
algo:
  entropy_coef: 0.012
  entropy_coef_mid: 0.0070
  entropy_coef_end: 0.0040
  entropy_anneal_frac1: 0.50
  entropy_anneal_frac2: 1.00
  entropy_schedule_mode: by_switch_age  # by_switch_age | by_level
  entropy_decay_iters_per_level: 3200
  # Keep some exploration on curriculum switch, but avoid the large L4 collapse
  # we observed immediately after the level-up transition.
  switch_entropy_boost_mult: 1.10
  switch_entropy_boost_iters: 250
  switch_std_recover_ratio: 0.20
  critic_priv_enable: true
  critic_aux_enable: true
  critic_aux_w: 0.05
  critic_aux_target_idx: [0, 4, 5, 7]
  actor_log_std_min: -0.8
  actor_log_std_max: 0.5
  actor_log_std_init: -0.10
  actor_lr: 0.00010
  critic_lr: 0.00025
  clip_param: 0.18
  ppo_epochs: 4
  num_minibatches: 4
  bptt_len: 64
  sequence_num_minibatches: 4

model:
  temporal:
    enable: false
    type: gru
    hidden_size: 128
  teacher_student:
    enable: false
    distill_feature_w: 0.05
    distill_feature_w_end: 0.15
    distill_priv_w: 0.05
    distill_priv_w_end: 0.10
    ramp_iters: 1000

# resume_checkpoint: /home/csj/orp/models/orp6.1.pt
resume_checkpoint: null  # set to a .pt path to continue training, keep null to start from scratch

viewer:
  resolution: [960, 720]
  eye: [0., -2, 1]
  lookat: [0., 1., 0.]

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}
  job_type: train
  entity:
  project: orp-scripts
  mode: online # set to 'disabled' when debugging locally
  init_timeout: 300
  fallback_mode: offline
  disable_system_metrics: true
  run_id:
  monitor_gym: True
  tags:

defaults:
  - task: train_env_goal
  - algo: ppo
  - optional phase1_throughput: p1
  - optional phase1_done_fix: d4
  - _self_
